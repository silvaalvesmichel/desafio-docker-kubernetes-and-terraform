# Database credential. The value never lives in the repository: it is supplied at
# install time through .Values.postgres.password.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.secret.fullname" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "mural.postgres.password" . | quote }}
  DATABASE_URL: {{ include "mural.databaseUrl" . | quote }}
