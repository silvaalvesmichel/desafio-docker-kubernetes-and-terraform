# Applies the SQL migrations. It is a post-install/post-upgrade hook, so Helm runs it
# on every release, after the Secret, the ConfigMaps and the Postgres StatefulSet
# exist, and only returns when it completes. Until then /readyz keeps failing and the
# API pods receive no traffic. The migrations are idempotent, so re-running is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mural.fullname" . }}-migrate
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    # The previous Job is replaced on the next release; the last one is kept for inspection.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mural.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do
                echo "waiting for postgres at $PGHOST:$PGPORT"
                sleep 2
              done
              for f in /migrations/*.sql; do
                echo "applying $f"
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
          envFrom:
            - configMapRef:
                name: {{ include "mural.config.fullname" . }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mural.secret.fullname" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "mural.migrations.fullname" . }}
